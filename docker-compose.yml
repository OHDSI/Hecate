version: '3.8'

services:
  hecate-api:
    build: .
    image: hecate-api
    container_name: hecate-api
    ports:
      - "8080:8080"
    environment:
      - SERVER_ADDR=0.0.0.0:8080
      - QDRANT_URI=http://qdrant:6334
      - VECTORDB_DATA_PATH=/app/all_pairs.txt
      - CORS_ORIGINS=http://localhost:5173
      - PG__HOST=db
      - PG__PORT=5432
      - PG__USER=postgres
      - PG__PASSWORD=postgres
      - PG__DBNAME=hecate
      - VOCAB_SCHEMA=vocab_27_feb_2026
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - UMLS_API_KEY=${UMLS_API_KEY}
      - RUST_LOG=info
    depends_on:
      - qdrant
      - db

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  db:
    image: postgres:15
    container_name: hecate-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hecate
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
